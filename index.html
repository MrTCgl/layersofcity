<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>layers of city</title>
<meta name="description" content="Read a new city, layer by layer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B9A6DC' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3 L21 8 L12 13 L3 8 Z'/%3E%3Cpath d='M3 12.5 L12 17.5 L21 12.5' opacity='.55'/%3E%3Cpath d='M3 17 L12 22 L21 17' opacity='.25'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=20260711-11">
</head>
<body>

<header>
  <button class="logo" id="homebtn" data-i18n-label="aria.home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--lilac)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 L21 8 L12 13 L3 8 Z"/><path d="M3 12.5 L12 17.5 L21 12.5" opacity=".55"/><path d="M3 17 L12 22 L21 17" opacity=".25"/>
    </svg>
    <span>layers<span class="dim">of</span>city</span>
  </button>
  <div id="topchips">
    <button class="mchip" id="chip-varis" data-group="varis" aria-pressed="true" data-i18n-label="group.varis">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20v-8a8 8 0 0 1 16 0v8M4 20h16M8.5 20v-6.5a3.5 3.5 0 0 1 7 0V20"/></svg>
    </button>
    <div class="mchip-wrap">
      <button class="mchip" id="chip-omurga" aria-expanded="false" aria-pressed="true" data-i18n-label="group.omurga">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 19L19 4M6 4.5l13 14.5M12 3v18"/></svg>
      </button>
      <div class="linemenu" id="linemenu" hidden>
        <button class="ichip lchip" data-transit="metro" aria-pressed="true" data-i18n-label="transit.metro"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 21l1.5-4M15.5 21l-1.5-4"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="15" cy="14" r=".6" fill="currentColor"/></svg></button>
        <button class="ichip lchip" data-transit="tram" aria-pressed="true" data-i18n-label="transit.tram"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="13" rx="2"/><path d="M6 10.5h12M12 4V2M8.5 21l1.5-4M15.5 21l-1.5-4"/></svg></button>
        <button class="ichip lchip" data-transit="bus" aria-pressed="true" data-i18n-label="transit.bus"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M8 4V2.5M16 4V2.5M8 21l1-4M16 21l-1-4"/><circle cx="8.5" cy="14" r=".6" fill="currentColor"/><circle cx="15.5" cy="14" r=".6" fill="currentColor"/></svg></button>
        <button class="ichip lchip" data-transit="train" aria-pressed="true" data-i18n-label="transit.train"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14V8c0-3 2.5-4.5 6-4.5s6 1.5 6 4.5v6a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2Z"/><path d="M6 11h12M8.5 21l1.7-3M15.5 21l-1.7-3"/><circle cx="9.4" cy="13.4" r=".6" fill="currentColor"/><circle cx="14.6" cy="13.4" r=".6" fill="currentColor"/></svg></button>
      </div>
    </div>
  </div>
  <div class="grow"></div>
  <div class="langwrap">
    <button id="langbtn" aria-expanded="false" aria-label="language">TR</button>
    <div id="langmenu" hidden>
      <button data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
      <button data-lang="de" disabled>DE</button>
      <button data-lang="fr" disabled>FR</button>
      <button data-lang="it" disabled>IT</button>
      <button data-lang="es" disabled>ES</button>
    </div>
  </div>
  <button class="iconbtn" id="themebtn" data-i18n-label="aria.theme">
    <svg id="ic-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 13.5 A8.5 8.5 0 1 1 10.5 4 A7 7 0 0 0 20 13.5 Z"/></svg>
    <svg id="ic-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>
  </button>
</header>

<main>
  <!-- ═══ WORLD SCREEN (city picker) ═══ -->
  <section class="screen" id="scr-world">
    <div id="worldzoom">
      <h1 id="wordmark">layers <span class="of">of</span> city</h1>
      <div id="worldwrap">
        <svg id="worldmap" viewBox="40 16 920 400" role="img" aria-label="world map"></svg>
      </div>
    </div>
  </section>

  <!-- ═══ CITY SCREEN ═══ -->
  <section class="screen" id="scr-city">
    <div id="maparea">
      <div id="map"></div>

      <div class="placeholder" id="cityph" hidden>
        <h2 id="cityname"></h2>
        <p data-i18n="city.coming"></p>
      </div>

      <!-- city bar: name · date · live local time · live weather -->
      <button id="citybar" aria-expanded="false">
        <span class="cname" id="cb-name"></span>
        <span class="dim" id="cb-date"></span>
        <span id="cb-time"></span>
        <span id="cb-wx" class="cb-wx"></span>
      </button>

      <!-- city info card (künye): opens from the city bar -->
      <div class="infocard" id="infocard" hidden>
        <div class="ic-head">
          <span class="ic-city" id="ic-city"></span>
          <button class="ic-close" id="ic-close" data-i18n-label="aria.close">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="ic-meta">
          <div><span class="ic-k" data-i18n="info.lang"></span><span id="ic-lang"></span></div>
          <div><span class="ic-k" data-i18n="info.currency"></span><span id="ic-currency"></span></div>
        </div>
        <div class="ic-prices" id="ic-prices"></div>
        <div class="ic-weather" id="ic-weather"></div>
        <div class="ic-updated" id="ic-updated"></div>
      </div>

      <!-- left-edge drawer: city zones (turistik/ticari/egitim/dogal) -->
      <div id="drawerwrap">
        <button id="drawertab" aria-expanded="false" data-i18n-label="group.yasam">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg>
        </button>
        <div id="drawer">
          <button class="dchip" data-layer="bolge-turistik" aria-pressed="false" data-i18n="bolge.turistik"></button>
          <button class="dchip" data-layer="bolge-ticari" aria-pressed="false" data-i18n="bolge.ticari"></button>
          <button class="dchip" data-layer="bolge-egitim" aria-pressed="false" data-i18n="bolge.egitim"></button>
          <button class="dchip" data-layer="bolge-dogal" aria-pressed="false" data-i18n="bolge.dogal"></button>
        </div>
      </div>

      <!-- bottom bar + pop-up icon menus -->
      <nav id="bottombar">
        <button id="bb-kesfet" aria-expanded="false" data-i18n="bb.kesfet"></button>
        <button id="bb-ihtiyac" aria-expanded="false" data-i18n="bb.ihtiyac"></button>
      </nav>
      <div class="sheet" id="sheet-kesfet">
        <div class="chips">
          <button class="chip ichip" data-th="tarihi" aria-pressed="false" data-i18n-label="th.tarihi"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21v-8M9 21v-8M15 21v-8M19 21v-8M3 10l9-6 9 6H3Z"/></svg></button>
          <button class="chip ichip" data-th="modern" aria-pressed="false" data-i18n-label="th.modern"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9h6v12M10 21V4h6v17M16 21v-9h4v9M3 21h18"/></svg></button>
          <button class="chip ichip" data-th="doga" aria-pressed="false" data-i18n-label="th.doga"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21C6 12 12 5 21 4c-.5 9-6 15-15 17Z"/><path d="M6 21c2.5-5.5 6.5-9.5 11-12"/></svg></button>
          <button class="chip ichip" data-th="gastronomi" aria-pressed="false" data-i18n-label="th.gastronomi"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v5a2 2 0 0 0 2 2v11M9 3v5M7 3v5M16 3c-1.6 2.2-2 4.2-2 6 0 2 .8 3 2 3v9"/></svg></button>
          <button class="chip ichip" data-th="alisveris" aria-pressed="false" data-i18n-label="th.alisveris"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 13H7.2L6 8ZM9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
          <button class="chip ichip" data-th="otel" aria-pressed="false" data-i18n-label="th.otel"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V6M3 13h18v5M11 13V9h6a4 4 0 0 1 4 4"/><circle cx="6.8" cy="10" r="1.9"/></svg></button>
          <button class="chip ichip" data-th="yurt" aria-pressed="false" data-i18n-label="th.yurt"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18M4 8h16v4M4 15h16v4M20 8V6M20 19v-2"/><circle cx="8" cy="6" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg></button>
          <button class="chip ichip" data-th="kamu" aria-pressed="false" data-i18n-label="th.kamu"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h9v17M5 21h14M14 21V10h5v11M8 8h3M8 12h3M8 16h3M14 4l4 1.3-4 1.3"/></svg></button>
        </div>
      </div>
      <div class="sheet" id="sheet-ihtiyac">
        <div class="chips" id="ihchips">
          <button class="chip ichip" data-ih="kiralik-arac" aria-pressed="false" data-i18n-label="ih.kiralama"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.5-5.5A2 2 0 0 1 7.4 9h9.2a2 2 0 0 1 1.9 1.5L20 16M4 16h16v3.5h-2.5M4 16v3.5h2.5M7 19.5h10"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/></svg></button>
          <button class="chip ichip" data-ih="market" aria-pressed="false" data-i18n-label="ih.market"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l2-5M19 9l-2-5M3 9h18l-2 11H5L3 9ZM9 13v3.5M15 13v3.5M12 13v3.5"/></svg></button>
          <button class="chip ichip" data-ih="muze" aria-pressed="false" data-i18n-label="ih.muze"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M7 15l3-4 2.5 3 2-2.5L18 15"/><circle cx="9" cy="9" r="1"/></svg></button>
          <button class="chip ichip" data-ih="kutuphane" aria-pressed="false" data-i18n-label="ih.kutuphane"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 0-2 2V5Z"/><path d="M20 17H6a2 2 0 0 0-2 2"/></svg></button>
          <button class="chip ichip" data-ih="hastane" aria-pressed="false" data-i18n-label="ih.hastane"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v16M4 21h16M12 6.5v5M9.5 9h5"/></svg></button>
          <button class="chip ichip" data-ih="eczane" aria-pressed="false" data-i18n-label="ih.eczane"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5a4.95 4.95 0 0 1 7 7l-7 7a4.95 4.95 0 1 1-7-7Z"/><path d="M7 7l7 7"/></svg></button>
          <button class="chip ichip" data-ih="yakit" aria-pressed="false" data-i18n-label="ih.yakit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16M4 21h11M14 10h3a2 2 0 0 1 2 2v4.5a1.5 1.5 0 0 0 3 0V10l-2.5-3M7.5 7h4v4h-4Z"/></svg></button>
        </div>
      </div>

      <!-- right-bottom control column: zoom stack hidden under Home
           (hover/tap reveals), then locate (tour joins in E9) -->
      <div id="rightctl">
        <!-- zoom group sits at the TOP so its stack can open upward without
             pushing the icons below; Home is the bottom anchor, +/−/pan hide
             above it and slide up on hover/tap -->
        <div id="zoomctl">
          <div id="zoomstack">
            <button id="zoom-in" data-i18n-label="zoom.in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
            <button id="zoom-out" data-i18n-label="zoom.out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
            <button id="panbtn" data-i18n-label="pan.drag"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a1.4 1.4 0 0 1 2.8 0v4.5M11.8 10.5V4.6a1.4 1.4 0 0 1 2.8 0v5.9M14.6 11V6.8a1.4 1.4 0 0 1 2.8 0V14a6 6 0 0 1-6 6h-1.3a5 5 0 0 1-3.6-1.5l-2.7-2.8a1.4 1.4 0 0 1 2-2L9 11.5"/></svg></button>
          </div>
          <button id="zoom-home" data-i18n-label="zoom.home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9M10 19v-5h4v5"/></svg></button>
        </div>
        <!-- coordinate jump: paste "lat, lon" -> fly there -->
        <div class="ctlwrap">
          <div id="coordbox" hidden><input id="coordinput" type="text" inputmode="decimal" autocomplete="off" data-i18n-ph="coord.ph"><button id="coordgo" data-i18n-label="coord.submit"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>
          <button id="coordbtn" class="cbtn" data-i18n-label="coord.go"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
        </div>
        <!-- basemap switcher: sade / OSM detaylı / uydu + notes & GPS overlays -->
        <div class="ctlwrap">
          <div id="basemapmenu" hidden>
            <button class="bmopt" data-bm="sade" data-i18n="base.sade"></button>
            <button class="bmopt" data-bm="detay" data-i18n="base.detay"></button>
            <button class="bmopt" data-bm="uydu" data-i18n="base.uydu"></button>
            <div class="bmsep"></div>
            <button class="bmtog" id="tog-notes" aria-pressed="false" data-i18n="base.notlar"></button>
            <button class="bmtog" id="tog-gps" aria-pressed="false" data-i18n="base.gps"></button>
            <button class="bmtog" id="tog-walk" aria-pressed="false" data-i18n="base.walk"></button>
          </div>
          <button id="basemapbtn" class="cbtn" data-i18n-label="base.title"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L21 8 L12 13 L3 8 Z"/><path d="M3 12.5 L12 17.5 L21 12.5"/><path d="M3 17 L12 22 L21 17"/></svg></button>
        </div>
        <button id="locbtn" aria-pressed="false" data-i18n-label="loc.me">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5V4M12 20v2.5M1.5 12H4M20 12h2.5"/></svg>
        </button>
      </div>

      <!-- place card: opens when a POI is tapped; Yol tarifi -> Google Maps -->
      <div class="placecard" id="placecard" hidden>
        <span class="pc-name" id="pc-name"></span>
        <a class="pc-dir" id="pc-dir" target="_blank" rel="noopener" data-i18n="card.maps"></a>
        <button class="pc-close" id="pc-close" data-i18n-label="aria.close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </section>
</main>

<script src="assets/vendor/maplibre-gl.js"></script>
<script src="js/world-dots.js?v=20260711-11"></script>
<script src="js/app.js?v=20260711-11"></script>
</body>
</html>
