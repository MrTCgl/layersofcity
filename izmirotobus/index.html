    <!--
      Tek adres.

      Site Cloudflare Pages'te barındığı için <proje>.pages.dev adresinden
      de açılıyor; o adres Türkiye'de engelli ve trafiği ikiye bölüyor.
      Kanonik etiket arama motorlarına asıl adresi söylüyor, aşağıdaki
      betik de oraya düşen ziyaretçiyi yönlendiriyor.

      Betik satır içi ve <head> içinde: uygulama paketi (364 KB) hiç
      indirilmeden yönlendirme gerçekleşsin diye. `layersofcity.com`
      derleme sırasında Vite tarafından değiştiriliyor; tanımlı değilse
      (yerel geliştirme) yer tutucu olduğu gibi kalır ve betik hiçbir şey
      yapmaz.
    -->
    <link rel="canonical" href="https://layersofcity.com/izmirotobus/" />
    <script>
      (function () {
        var kanonik = 'layersofcity.com';
        if (kanonik.charAt(0) === '%') {
          // Değişken verilmeden derlenmiş: kanonik adres yer tutucu
          // içeriyor ve yanıltıcı olur, kaldırıyoruz.
          var etiketler = document.querySelectorAll(
            'link[rel="canonical"], meta[property="og:url"]',
          );
          for (var i = 0; i < etiketler.length; i++) etiketler[i].remove();
          return;
        }
        if (kanonik === location.hostname) return;
        if (!/\.pages\.dev$/.test(location.hostname)) return;
        location.replace(
          'https://' + kanonik + location.pathname + location.search + location.hash,
        );
      })();
    </script>
