/* ── üst çipler + çekmece + alt bar ───── */
function syncChips(){
  document.querySelectorAll("[data-ly]").forEach(el => {
    const ly = document.getElementById(el.dataset.ly);
    if (ly) el.setAttribute("aria-pressed", !ly.classList.contains("off"));
  });
}
document.querySelectorAll("#topchips .mchip, #drawer .dchip").forEach(b => {
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", on);
    document.getElementById(b.dataset.ly).classList.toggle("off", !on);
  };
});
const drawerwrap = document.getElementById("drawerwrap");
document.getElementById("drawertab").onclick = function(){
  const open = drawerwrap.classList.toggle("open");
  this.setAttribute("aria-expanded", open);
};
function closeSheets(){
  document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show"));
  document.querySelectorAll("#bottombar [aria-expanded]").forEach(b => b.setAttribute("aria-expanded","false"));
}
function toggleSheet(id, btn){
  const s = document.getElementById(id);
  const show = !s.classList.contains("show");
  closeSheets();
  if (show){ s.classList.add("show"); btn.setAttribute("aria-expanded", "true"); }
}
document.getElementById("bb-kesfet").onclick = function(){ toggleSheet("sheet-kesfet", this); };
document.getElementById("bb-ihtiyac").onclick = function(){ toggleSheet("sheet-ihtiyac", this); };
document.getElementById("turbtn").onclick = () => { closeSheets(); startIntro(); };
document.querySelectorAll('#sheet-kesfet .chip[data-th]').forEach(ch => {
  ch.onclick = () => {
    const on = ch.getAttribute("aria-pressed") !== "true";
    ch.setAttribute("aria-pressed", on);
    document.querySelectorAll(`.poi[data-th="${ch.dataset.th}"]`)
      .forEach(p => p.classList.toggle("on", on));
  };
});
const yog = document.getElementById("chip-yog");
yog.onclick = () => {
  const on = yog.getAttribute("aria-pressed") !== "true";
  yog.setAttribute("aria-pressed", on);
  document.getElementById("ly-yogunluk").classList.toggle("off", !on);
};

/* ── yer kartı + yol tarifi (Google Maps) ── */
const poip = document.getElementById("poip");
document.querySelectorAll("#rome .poi, #rome .ihp").forEach(g => {
  g.addEventListener("click", e => {
    e.stopPropagation();
    closeSheets();
    const t = g.querySelector("text");
    const name = g.dataset.name || (t ? t.textContent : "Roma");
    document.getElementById("poip-name").textContent = name;
    document.getElementById("poip-go").href =
      "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + ", Roma");
    poip.classList.add("show");
  });
});
document.getElementById("poip-x").onclick = () => poip.classList.remove("show");

/* ── şehir çubuğu: canlı saat + künye ──── */
function tickClock(){
  const now = new Date();
  const loc = lang === "tr" ? "tr-TR" : "en-GB";
  document.getElementById("cb-date").textContent =
    new Intl.DateTimeFormat(loc, { timeZone:"Europe/Rome", day:"numeric", month:"short" }).format(now);
  document.getElementById("cb-time").textContent =
    new Intl.DateTimeFormat(loc, { timeZone:"Europe/Rome", hour:"2-digit", minute:"2-digit" }).format(now);
}
setInterval(tickClock, 10000); tickClock();
const facts = document.getElementById("facts");
document.getElementById("citybar").onclick = function(){
  const open = !facts.classList.contains("show");
  facts.classList.toggle("show", open);
  this.setAttribute("aria-expanded", open);
};

/* ── bütçe yıldızları ─────────────────── */
let budget = 0; // 0 = hepsi
function applyBudget(){
  document.querySelectorAll('#rome [data-budget]').forEach(el =>
    el.classList.toggle("b-hid", budget > 0 && +el.dataset.budget !== budget));
}
document.querySelectorAll("#stars button").forEach(b => {
  b.onclick = () => {
    const v = +b.dataset.b;
    budget = (budget === v) ? 0 : v;
    document.querySelectorAll("#stars button").forEach(x =>
      x.classList.toggle("on", budget > 0 && +x.dataset.b <= budget));
    applyBudget();
  };
});

    ch.setAttribute("aria-pressed", on);

/* ── konum ────────────────────────────── */
const toast = document.getElementById("toast");
let toastTimer;
function showToast(msg){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}
document.getElementById("locbtn").onclick = function(){
  const dot = document.getElementById("userdot");
  const on = dot.style.display === "none";
  dot.style.display = on ? "" : "none";
  this.setAttribute("aria-pressed", on);
  if (on) showToast(t("toast.loc"));
};

/* ── rehberli mod ─────────────────────── */
const zoomer = document.getElementById("zoomer");
const introBox = document.getElementById("intro");
let introOn = false, step = 0, savedState = null;
const ALL_LYS = ["ly-varis","ly-omurga","ly-poi","ly-yogunluk","ly-otel","ly-konut","ly-altmerkez","ly-ogrenci"];
function setLayers(ids){
  ALL_LYS.forEach(id => document.getElementById(id).classList.toggle("off", !ids.includes(id)));
  document.getElementById("ly-poi").classList.toggle("intro-all", ids.includes("ly-poi"));
}
function setCam(c){
  zoomer.style.transform = `translate(${500 - c.s*c.x}px, ${380 - c.s*c.y}px) scale(${c.s})`;
}

/* ── zoom & pan (çift tıkla + kontroller) ── */
const HOME = { s:1, x:500, y:380 };
let view = { ...HOME };
function clampView(v){
  v.s = Math.max(1, Math.min(5, v.s));
  const hx = 500 / v.s, hy = 380 / v.s;
  v.x = Math.max(hx, Math.min(1000 - hx, v.x));
  v.y = Math.max(hy, Math.min(760 - hy, v.y));
  return v;
}
function applyView(){ if (!introOn) setCam(view); }
function zoomBy(f, cx, cy){
  view = clampView({ s: view.s * f, x: cx ?? view.x, y: cy ?? view.y });
  applyView();
}
const rome = document.getElementById("rome");
function dataPoint(e){
  const pt = rome.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(zoomer.getScreenCTM().inverse());
}
rome.addEventListener("dblclick", e => {
  e.preventDefault();
  const p = dataPoint(e);
  zoomBy(1.8, p.x, p.y);
});
document.getElementById("zoom-in").onclick = () => zoomBy(1.6);
document.getElementById("zoom-out").onclick = () => zoomBy(1/1.6);
document.getElementById("zoom-home").onclick = () => { view = { ...HOME }; applyView(); };
function showStep(i){
  step = i;
  document.getElementById("stepnum").textContent = (i+1) + "/5";
  document.getElementById("introtext").textContent = INTRO[lang][i];
  document.getElementById("i-back").style.visibility = i===0 ? "hidden" : "visible";
  document.getElementById("i-next").textContent = i===4 ? t("intro.done") : t("intro.next");
  setLayers(INTRO_STATE[i]); setCam(INTRO_CAM[i]);
}
function startIntro(){
  introOn = true;
  savedState = {};
  ALL_LYS.forEach(id => savedState[id] = !document.getElementById(id).classList.contains("off"));
  introBox.classList.add("show");
  showStep(0);
}
function exitIntro(){
  if (!introOn) return;
  introOn = false;
  introBox.classList.remove("show");
  view = { ...HOME };
  setCam(view);
  document.getElementById("ly-poi").classList.remove("intro-all");
  if (savedState) ALL_LYS.forEach(id => document.getElementById(id).classList.toggle("off", !savedState[id]));
  syncChips();
}
document.getElementById("i-exit").onclick = exitIntro;
document.getElementById("i-back").onclick = () => { if (step>0) showStep(step-1); };
document.getElementById("i-next").onclick = () => { step===4 ? exitIntro() : showStep(step+1); };

applyTheme(); applyLang();
</script>
