<title>layers of city — prototip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#FBF8F6; --surface:#FFFFFF; --ink:#3E3A45; --ink-soft:#8B8494;
  --line:#EAE4EE; --lilac:#B9A6DC; --peach:#F2BBA8; --powder:#EFD9DE;
  --land:#E4DDD6; --water:#F7F4F1; --shadow:0 2px 12px rgba(0,0,0,.06);
  --m-a:#E08A5B; --m-b:#6E93C4; --m-c:#7FA98A; --tram:#A8A0B5; --rail:#B5ADA0;
}
:root[data-theme="dark"]{
  --bg:#232028; --surface:#2C2833; --ink:#EDE9F2; --ink-soft:#9A93A6;
  --line:#3A3542; --lilac:#C4B2E4; --peach:#E8B39E; --powder:#8A7480;
  --land:#332E3D; --water:#262230; --shadow:none;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
button:focus-visible{outline:2px solid var(--lilac); outline-offset:2px; border-radius:6px}

/* ── üst bar ─────────────────────────── */
header{
  height:56px; flex:none; display:flex; align-items:center; gap:12px;
  padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line);
  position:relative; z-index:30;
}
.logo{display:flex; align-items:center; gap:10px; letter-spacing:.18em; font-size:15px; font-weight:600}
.logo svg{flex:none}
.logo .dim{color:var(--ink-soft); font-weight:400}
header .grow{flex:1}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{padding:5px 12px; font-size:12px; letter-spacing:.06em; color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--lilac); color:var(--surface)}
.iconbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:999px; color:var(--ink-soft)}
.iconbtn:hover{background:var(--powder); color:var(--ink)}
:root[data-theme="dark"] .iconbtn:hover{background:var(--line)}

/* ── ekranlar ─────────────────────────── */
main{flex:1; position:relative; overflow:hidden}
.screen{position:absolute; inset:0; display:flex; opacity:0; visibility:hidden; transition:opacity .35s}
.screen.on{opacity:1; visibility:visible}

/* ── dünya ekranı ─────────────────────── */
#scr-world{flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px}
#worldwrap{width:min(1060px,100%);}
#worldmap{width:100%; height:auto; display:block}
.worlddot{fill:var(--land)}
:root[data-theme="dark"] .worlddot{fill:#4A4456}
.city-ready{cursor:pointer}
.city-ready .halo{fill:var(--lilac); opacity:.25; animation:pulse 2.6s ease-out infinite; transform-origin:center; transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.35}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.city-ready .halo{animation:none; opacity:.2}}
.city-ready circle.core{fill:var(--lilac); stroke:var(--surface); stroke-width:2}
.city-ready text{fill:var(--ink); font-size:13px; font-weight:600}
.city-ready:hover circle.core{fill:var(--peach)}
.city-soon circle{fill:var(--ink-soft); opacity:.45}
.city-soon text{fill:var(--ink-soft); font-size:10px; opacity:0; transition:opacity .2s; pointer-events:none}
.city-soon:hover text{opacity:.9}
#worldhint{color:var(--ink-soft); font-size:13px; text-align:center}
#worldhint b{color:var(--ink); font-weight:600}

/* ── şehir ekranı ─────────────────────── */
#scr-city{flex-direction:row}
#panel{
  width:300px; flex:none; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow-y:auto; z-index:20;
}
#panel .city-name{padding:18px 20px 6px; font-size:24px; font-weight:700; letter-spacing:.01em}
#panel .city-sub{padding:0 20px 14px; font-size:12px; color:var(--ink-soft)}
.group{border-top:1px solid var(--line); padding:12px 20px 14px}
.group h3{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; font-weight:600}
.row{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px}
.row .lbl{flex:1; display:flex; align-items:center; gap:9px}
.row svg{color:var(--ink-soft); flex:none}
.tgl{
  width:38px; height:22px; border-radius:999px; background:var(--line);
  position:relative; flex:none; transition:background .15s;
}
.tgl::after{
  content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
  border-radius:999px; background:var(--surface); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.tgl[aria-pressed="true"]{background:var(--lilac)}
.tgl[aria-pressed="true"]::after{left:19px}
.chips{display:flex; flex-wrap:wrap; gap:6px; padding:4px 0 2px}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
  font-size:12px; color:var(--ink-soft); transition:all .15s;
}
.chip[aria-pressed="true"]{background:var(--peach); border-color:var(--peach); color:#4A3A33}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#2E2620}
.introrow{
  margin-top:auto; border-top:1px solid var(--line); padding:15px 20px;
  display:flex; align-items:center; gap:9px; font-size:14px; color:var(--ink);
  width:100%; text-align:left;
}
.introrow:hover{color:var(--lilac)}
.sheet-handle{display:none}

/* ── harita alanı ─────────────────────── */
#maparea{flex:1; position:relative; background:var(--water); overflow:hidden}
#rome{width:100%; height:100%; display:block}
#rome .bg{fill:var(--water)}
#rome .gra{fill:none; stroke:var(--land); stroke-width:2.5; stroke-dasharray:3 7; opacity:.9}
#rome .river{fill:none; stroke:var(--land); stroke-width:13; stroke-linecap:round; opacity:.9}
:root[data-theme="dark"] #rome .river,:root[data-theme="dark"] #rome .gra{opacity:.7}
#rome .basetext{fill:var(--ink-soft); font-size:11px}
#rome text{font-family:inherit; pointer-events:none}
.ly{transition:opacity .4s}
.ly.off{opacity:0; pointer-events:none}
/* varış */
.gate circle{fill:var(--surface); stroke:var(--ink-soft); stroke-width:1.5}
.gate text{fill:var(--ink); font-size:12px; font-weight:600}
.gate .sub{fill:var(--ink-soft); font-size:9.5px; font-weight:400}
.gatelink{fill:none; stroke:var(--lilac); stroke-width:2.5; stroke-dasharray:1 6; stroke-linecap:round}
/* omurga */
.mline{fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.stn{fill:var(--surface); stroke-width:1.6}
.hublbl{fill:var(--ink); font-size:12.5px; font-weight:700}
.stlbl{fill:var(--ink-soft); font-size:10px}
.centermark text{fill:var(--ink); font-size:11px; font-weight:600}
/* keşfet */
.poi circle{stroke:var(--surface); stroke-width:1.6}
.poi text{fill:var(--ink-soft); font-size:9.5px}
.poi.hid{display:none}
.blob{fill:var(--peach); opacity:.3}
.blob-lbl{fill:var(--ink-soft); font-size:9.5px; font-style:italic}
/* yaşam */
.area{opacity:.32; stroke:none}
.area-lbl{fill:var(--ink-soft); font-size:10px; font-weight:600}
.axis{fill:none; stroke:var(--ink-soft); stroke-width:1.8; stroke-dasharray:5 5; opacity:.6}
/* konum */
#userdot circle.me{fill:var(--lilac); stroke:var(--surface); stroke-width:2.5}
#userdot .mehalo{fill:var(--lilac); opacity:.2; animation:pulse 2.4s ease-out infinite; transform-origin:center; transform-box:fill-box}
#locbtn{
  position:absolute; right:16px; bottom:22px; width:44px; height:44px;
  border-radius:999px; background:var(--surface); box-shadow:var(--shadow);
  border:1px solid var(--line); display:grid; place-items:center; color:var(--ink-soft); z-index:15;
}
#locbtn:hover{color:var(--lilac)}
#locbtn[aria-pressed="true"]{color:var(--lilac)}
.toast{
  position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:999px; padding:8px 18px; font-size:12.5px; color:var(--ink);
  opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; z-index:16;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.protonote{
  position:absolute; left:16px; bottom:22px; font-size:10.5px; color:var(--ink-soft);
  background:color-mix(in srgb, var(--surface) 75%, transparent); border-radius:999px; padding:4px 10px; z-index:14;
}
/* rehberli mod kartı */
#intro{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
  width:min(430px, calc(100% - 32px)); background:var(--surface);
  border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  padding:14px 16px 12px; z-index:18; display:none;
}
#intro.show{display:block}
#intro .steplbl{font-size:10.5px; letter-spacing:.12em; color:var(--lilac); font-weight:600; margin-bottom:5px}
#intro p{font-size:13.5px; line-height:1.5; min-height:40px}
#intro .nav{display:flex; align-items:center; gap:6px; margin-top:9px}
#intro .nav .grow{flex:1}
#intro .nav button{font-size:12.5px; padding:6px 13px; border-radius:999px; color:var(--ink-soft)}
#intro .nav button.pri{background:var(--lilac); color:var(--surface)}
#intro .nav button:not(.pri):hover{background:var(--powder)}
:root[data-theme="dark"] #intro .nav button:not(.pri):hover{background:var(--line)}

/* ── mobil ────────────────────────────── */
@media (max-width:719px){
  #scr-city{flex-direction:column}
  #maparea{order:0}
  #panel{
    order:1; width:100%; border-right:none; border-top:1px solid var(--line);
    max-height:52px; transition:max-height .3s ease; overflow:hidden;
  }
  #panel.open{max-height:58vh; overflow-y:auto}
  .sheet-handle{
    display:flex; width:100%; align-items:center; justify-content:center; gap:8px;
    padding:15px; font-size:13px; font-weight:600; color:var(--ink-soft); flex:none;
  }
  .sheet-handle::before{content:""; width:36px; height:4px; border-radius:99px; background:var(--line)}
  #panel .city-name,#panel .city-sub{display:none}
  .introrow{margin-top:0}
  #locbtn{bottom:70px}
  .protonote{bottom:70px}
  #intro{bottom:64px}
}

};
let lang = localStorage.getItem("loc-lang") || "tr";

const INTRO = {
  tr: [
    "Roma'ya iki havaalanından inersin. Fiumicino'dan Leonardo Express treni seni 32 dakikada Termini'ye getirir.",
    "Termini ulaşımın kalbi. Ama gezilecek 'tarihi merkez' burası değil — 15 dakika batıda.",
    "Şehrin omurgası üç metro hattı: A, B ve C. Çoğu ziyaretçiye A ile B yeter.",
    "Kolezyum B hattında, Vatikan A hattının hemen yanında. İlgi alanına göre filtreleyebilirsin.",
    "Öğle saatlerinde Trevi çevresi çok kalabalıklaşır. Artık harita senin: katmanları aç, kapat, keşfet."
  ],
  en: [
    "You land in Rome at one of two airports. From Fiumicino, the Leonardo Express gets you to Termini in 32 minutes.",
    "Termini is the transit heart. But the historic center you came to see is 15 minutes west.",
    "Three metro lines form the city's backbone: A, B and C. Most visitors only need A and B.",
    "The Colosseum sits on line B, the Vatican right by line A. Filter by what interests you.",
    "Around noon, the Trevi area gets very crowded. The map is yours now — toggle layers and explore."
  ]
};
const INTRO_STATE = [
  ["ly-varis"],
  ["ly-varis","ly-omurga"],
  ["ly-omurga"],
  ["ly-omurga","ly-poi"],
  ["ly-omurga","ly-poi","ly-yogunluk"]
];
const INTRO_CAM = [
  {s:1, x:500, y:380},
  {s:2.1, x:560, y:335},
  {s:1.15, x:520, y:380},
  {s:1.6, x:470, y:330},
  {s:1.9, x:475, y:320}
];

function t(k){ return STR[lang][k] || STR.en[k] || k; }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById("worldhint").innerHTML = t("worldhint");
  document.getElementById("lang-tr").setAttribute("aria-pressed", lang==="tr");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang==="en");
  if (introOn) showStep(step);
}
document.getElementById("lang-tr").onclick = () => { lang="tr"; localStorage.setItem("loc-lang",lang); applyLang(); };
document.getElementById("lang-en").onclick = () => { lang="en"; localStorage.setItem("loc-lang",lang); applyLang(); };

/* ── tema ─────────────────────────────── */
const root = document.documentElement;
let theme = localStorage.getItem("loc-theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme(){
  root.dataset.theme = theme;
  document.getElementById("ic-moon").style.display = theme==="light" ? "" : "none";
  document.getElementById("ic-sun").style.display  = theme==="dark"  ? "" : "none";
}
document.getElementById("themebtn").onclick = () => {
  theme = theme==="light" ? "dark" : "light";
  localStorage.setItem("loc-theme", theme); applyTheme();
};

/* ── dünya ekranı ─────────────────────── */
const CITIES = [
  {id:"roma", name:"Roma", x:534.7, y:133.6, ready:true, anchor:[10,22]},
  {id:"istanbul", name:"İstanbul", x:580.4, y:136.1, anchor:[8,4]},
  {id:"london", name:"London", x:499.6, y:106.9, anchor:[-52,2]},
  {id:"paris", name:"Paris", x:506.5, y:117.3, anchor:[-40,12]},
  {id:"berlin", name:"Berlin", x:537.2, y:104.1, anchor:[7,-2]},
  {id:"madrid", name:"Madrid", x:489.7, y:137.7, anchor:[-52,10]},
  {id:"newyork", name:"New York", x:294.4, y:136.9, anchor:[8,4]},
  {id:"tokyo", name:"Tokyo", x:888, y:150.9, anchor:[-14,20]}
];
const wm = document.getElementById("worldmap");
const NS = "http://www.w3.org/2000/svg";
let dg = "";
for (let i = 0; i < WORLD_DOTS.length; i += 2)
  dg += `<circle class="worlddot" cx="${WORLD_DOTS[i]}" cy="${WORLD_DOTS[i+1]}" r="2.1"/>`;
wm.innerHTML = dg;
CITIES.forEach(c => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", c.ready ? "city-ready" : "city-soon");
  const label = c.ready ? c.name : c.name;
  g.innerHTML = c.ready
    ? `<circle class="hit" cx="${c.x}" cy="${c.y}" r="24" fill="transparent"/>
       <circle class="halo" cx="${c.x}" cy="${c.y}" r="14"/>
       <circle class="core" cx="${c.x}" cy="${c.y}" r="6"/>
       <text x="${c.x + c.anchor[0]}" y="${c.y + c.anchor[1]}">${label}</text>`
    : `<circle cx="${c.x}" cy="${c.y}" r="3.4"/>
       <text x="${c.x + c.anchor[0]}" y="${c.y + c.anchor[1]}">${label}</text>`;
  if (c.ready) {
    g.setAttribute("role","button"); g.setAttribute("tabindex","0");
    g.addEventListener("click", () => gotoCity());
    g.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") gotoCity(); });
  }
  wm.appendChild(g);
});

const scrWorld = document.getElementById("scr-world");
const scrCity  = document.getElementById("scr-city");
function gotoCity(){ scrWorld.classList.remove("on"); scrCity.classList.add("on"); }
function gotoWorld(){ exitIntro(); scrCity.classList.remove("on"); scrWorld.classList.add("on"); }
document.getElementById("homebtn").onclick = gotoWorld;

/* ── katman anahtarları ───────────────── */
document.querySelectorAll(".tgl").forEach(b => {
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", on);
    document.getElementById(b.dataset.ly).classList.toggle("off", !on);
  };
});
document.querySelectorAll(".chip").forEach(ch => {
  ch.onclick = () => {
    const on = ch.getAttribute("aria-pressed") !== "true";
    ch.setAttribute("aria-pressed", on);
    document.querySelectorAll(`.poi[data-th="${ch.dataset.th}"]`)
      .forEach(p => p.classList.toggle("hid", !on));
  };
});

/* ── mobil çekmece ────────────────────── */
document.getElementById("sheethandle").onclick =
  () => document.getElementById("panel").classList.toggle("open");

/* ── konum ────────────────────────────── */
const toast = document.getElementById("toast");
let toastTimer;
function showToast(msg){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}
document.getElementById("locbtn").onclick = function(){
  const dot = document.getElementById("userdot");
  const on = dot.style.display === "none";
  dot.style.display = on ? "" : "none";
  this.setAttribute("aria-pressed", on);
  if (on) showToast(t("toast.loc"));
};

/* ── rehberli mod ─────────────────────── */
const zoomer = document.getElementById("zoomer");
const introBox = document.getElementById("intro");
let introOn = false, step = 0, savedState = null;
function setLayers(ids){
  ["ly-varis","ly-omurga","ly-poi","ly-yogunluk","ly-otel","ly-konut","ly-altmerkez","ly-ogrenci"]
    .forEach(id => document.getElementById(id).classList.toggle("off", !ids.includes(id)));
}
function setCam(c){
  zoomer.style.transform = `translate(${500 - c.s*c.x}px, ${380 - c.s*c.y}px) scale(${c.s})`;
}
function showStep(i){
  step = i;
  document.getElementById("stepnum").textContent = (i+1) + "/5";
  document.getElementById("introtext").textContent = INTRO[lang][i];
  document.getElementById("i-back").style.visibility = i===0 ? "hidden" : "visible";
  document.getElementById("i-next").textContent = i===4 ? t("intro.done") : t("intro.next");
  setLayers(INTRO_STATE[i]); setCam(INTRO_CAM[i]);
}
document.getElementById("introbtn").onclick = () => {
  introOn = true;
  savedState = {};
  document.querySelectorAll(".tgl").forEach(b => savedState[b.dataset.ly] = b.getAttribute("aria-pressed")==="true");
  introBox.classList.add("show");
  document.getElementById("panel").classList.remove("open");
  showStep(0);
};
function exitIntro(){
  if (!introOn) return;
  introOn = false;
  introBox.classList.remove("show");
  setCam({s:1, x:500, y:380});
  if (savedState){
    Object.entries(savedState).forEach(([id,on]) => {
      document.getElementById(id).classList.toggle("off", !on);
      document.querySelector(`.tgl[data-ly="${id}"]`).setAttribute("aria-pressed", on);
    });
  }
}
document.getElementById("i-exit").onclick = exitIntro;
document.getElementById("i-back").onclick = () => { if (step>0) showStep(step-1); };
document.getElementById("i-next").onclick = () => { step===4 ? exitIntro() : showStep(step+1); };

applyTheme(); applyLang();
</script>
